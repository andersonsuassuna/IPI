{% extends 'base.html' %}
{% load static %}
{% block title %} Listagem {% endblock %}

{% block content %}
  <main>
    <h2>Catálogo de Itens</h2>

    <table class="tabela-listagem">
      <thead>
        <tr>
          <th>Nome</th>
          <th>Marca</th>
          <th>Preço</th>
          <th>Tamanho</th>
        </tr>
      </thead>
      <tbody>
        {% for roupa in roupas %}
        <tr>
          <td><a href="{% url 'roupas:detalhe' roupa.id %}">{{ roupa.nome }}</a></td>
          <td>{{ roupa.marca }}</td>
          <td>{{ roupa.preco }}</td>
          <td>{{ roupa.tamanho }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </main>

{% endblock %}
